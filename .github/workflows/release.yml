name: Release APK

# Neues Release: Tag pushen (git tag v0.0.2 && git push origin v0.0.2)
# oder unter Actions → "Release APK" → "Run workflow" eine Version eingeben.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version ohne v, z. B. 0.0.2'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            # Ohne festen Schlüssel ließe sich die nächste Version nicht über diese installieren:
            # Android würde das Update ablehnen und man müsste neu installieren (Widgets weg).
            echo "::error::Secret KEYSTORE_BASE64 fehlt. Releases brauchen einen festen Signaturschlüssel, damit Updates Widgets und Daten behalten (siehe README)."
            exit 1
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ./gradlew --no-daemon assembleRelease -PversionName="$VERSION" -PversionCode="$((100 + GITHUB_RUN_NUMBER))"
          cp app/build/outputs/apk/release/app-release.apk "EventCountdown-$VERSION.apk"

      - name: Replace an existing release with the same version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "v$VERSION" --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Event Countdown ${{ env.VERSION }}
          files: EventCountdown-*.apk
          generate_release_notes: true
